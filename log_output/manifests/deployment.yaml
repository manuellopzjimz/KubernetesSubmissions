apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes: 
        - name: shared-logs
          persistentVolumeClaim:
            claimName: count-claim
      containers:
        - name: log-output
          image: manulopez/log_output:1.11
          volumeMounts:
            - name: shared-logs
              mountPath: /app/files