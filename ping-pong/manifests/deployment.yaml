apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes: 
        - name: shared-logs
          persistentVolumeClaim:
            claimName: count-claim
      containers:
        - name: ping-pong
          image: manulopez/ping_pong:1.11
          volumeMounts:
            - name: shared-logs
              mountPath: /app/files
          env:
            - name: PORT
              value: "3000"

